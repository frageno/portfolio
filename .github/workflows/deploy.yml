name: Deploy Portfolio

on:
  push:
    branches:
      - deploy-production # or your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: 📂 Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASS }}
          local-dir: ./out/
          server-dir: /public-html/
          dangerous-clean-slate: true
          timeout: 600000           # Increased timeout to 10 minutes
          max-connections: 1        # Limit to single connection
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          retry-count: 5           # Increased retry attempts
          retry-delay: 10000       # Increased delay between retries
          passive: true   